[supervisord]
logfile=./logs/supervisord.log
loglevel=info
pidfile=./logs/supervisord.pid
nodaemon=false

[program:accesco-worker]
; Use .venv/bin/python if using a virtualenv on Linux
command=.venv/bin/python worker.py
directory=%(here)s/..
autostart=true
autorestart=true
stderr_logfile=./logs/worker.err.log
stdout_logfile=./logs/worker.out.log
startretries=3

[program:accesco-app]
; Production WSGI server — never use `python run.py` in production
command=.venv/bin/gunicorn -c deploy/gunicorn.conf.py run:application
directory=%(here)s/..
autostart=true
autorestart=true
stderr_logfile=./logs/app.err.log
stdout_logfile=./logs/app.out.log
startretries=3

# ============================================================================
# TorchServe Configuration — Audio Toxicity Classification Service
# Target Hardware: CPU-based deployment (GPU variant available separately)
# ============================================================================

# ---------------------------------------------------------------------------
# API Endpoints — bind to all interfaces for container networking
# ---------------------------------------------------------------------------
inference_address=http://0.0.0.0:8080
management_address=http://0.0.0.0:8081
metrics_address=http://0.0.0.0:8082

# ---------------------------------------------------------------------------
# Model Store
# ---------------------------------------------------------------------------
model_store=/home/model-server/model-store
load_models=audio_toxicity.mar

# ---------------------------------------------------------------------------
# Worker / CPU Configuration
#   - 2 workers for pipeline overlap (one preprocesses while the other runs inference)
# ---------------------------------------------------------------------------
number_of_gpu=0
number_of_netty_threads=16
job_queue_size=256
default_workers_per_model=2

# ---------------------------------------------------------------------------
# Dynamic Batching — audio_toxicity model-specific overrides
#   - max_batch_size=8   : balances throughput without excessive memory use
#   - max_batch_delay=50 : 50 ms aggregation window balances throughput vs p99 latency
# ---------------------------------------------------------------------------
batch_size=8
max_batch_delay=50

# Model-level overrides (applied via management API at registration)
models={\
  "audio_toxicity": {\
    "1.0": {\
      "defaultVersion": true,\
      "marName": "audio_toxicity.mar",\
      "minWorkers": 2,\
      "maxWorkers": 2,\
      "batchSize": 8,\
      "maxBatchDelay": 50,\
      "responseTimeout": 30\
    }\
  }\
}

# ---------------------------------------------------------------------------
# Timeouts (seconds)
# ---------------------------------------------------------------------------
default_response_timeout=30
job_ticket_timeout=60

# ---------------------------------------------------------------------------
# Logging & Monitoring
# ---------------------------------------------------------------------------
async_logging=true
enable_metrics_api=true
metrics_mode=prometheus
enable_envvars_config=true

# Log full response payloads for debugging/auditing
tsconfig.log_response=true

# System-level resource telemetry
vmargs=-Dlog4j.configurationFile=log4j2.xml

# ---------------------------------------------------------------------------
# Payload Limits — support large audio files (up to 25 MB)
# ---------------------------------------------------------------------------
max_request_size=26214400
max_response_size=10485760

# ---------------------------------------------------------------------------
# CORS — disabled by default for internal microservice deployments
# ---------------------------------------------------------------------------
# cors_allowed_origin=*
# cors_allowed_methods=GET, POST
# cors_allowed_headers=Content-Type
